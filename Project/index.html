<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Soundboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <h1>Soundboard</h1>
        <div class="controls">
            <label for="volume">Volume</label>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7">
            <button id="mute-btn">Mute</button>
        </div>
        <div class="board">
            <button class="sound-btn" data-sound="dog">Dog</button>
            <button class="sound-btn" data-sound="clap">Clap</button>
            <button class="sound-btn" data-sound="pop">Pop</button>
            <button class="sound-btn" data-sound="laugh">Laugh</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
